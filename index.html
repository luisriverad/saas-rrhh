<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TABLERO DE CONTROL PARA RRHH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      ::selection { background: #fed7aa; color: #0f172a; }
      *:focus-visible { outline: 2px solid #c2410c; outline-offset: 2px; }

      /* Modo impresión: ocultar sidebar, topbar y footer; expandir contenido a página completa */
      @media print {
        @page { margin: 14mm 12mm; size: A4 portrait; }
        body { background: #fff !important; }
        .no-print { display: none !important; }
        .print-main { max-width: 100% !important; padding: 0 !important; }
        .print-page { background: #fff !important; background-image: none !important; }
        /* Permitir que cards y secciones se partan entre páginas de forma natural */
        h2, h3 { page-break-after: avoid; }
        table { page-break-inside: auto; }
        tr { page-break-inside: avoid; }
        .chart-copy-btn { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
